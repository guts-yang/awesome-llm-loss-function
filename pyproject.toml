[project]
name = "awesome-llm-loss-function"
version = "0.1.0"
description = "Interactive atlas of LLM loss functions, from language modeling and alignment to distillation and unlearning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.33",
  "numpy>=1.26",
  "scipy>=1.11",
  "sympy>=1.12",
  "plotly>=5.20",
  "pydantic>=2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
